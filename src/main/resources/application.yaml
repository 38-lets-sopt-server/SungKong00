spring:
  profiles:
    active: jpa
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-deploy}
    access-token-expires-in-seconds: 1800     # 30분
    refresh-token-expires-in-seconds: 1209600 # 2주
server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "https://sopt-38-castlekong.p-e.kr"
    allow-credentials: false
  swagger:
    server-url: ${SWAGGER_SERVER_URL:}
